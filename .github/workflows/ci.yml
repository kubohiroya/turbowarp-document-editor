name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run pack:check
      # Match the ScratchBlocks revision pinned by the Editor integration.
      - uses: actions/checkout@v4
        with:
          repository: TurboWarp/scratch-blocks
          ref: 4113c5348e6b4c76da9071a1800a62ab96ef793f
          path: .test-fixtures/scratch-blocks
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /blockly_compressed_vertical.js
            /blocks_compressed_vertical.js
            /msg/scratch_msgs.js
      - name: Test native preview visibility
        run: node --test test/block-preview-visibility.native.ts
        env:
          TWPE_TEST_SCRATCH_BLOCKS: ${{ github.workspace }}/.test-fixtures/scratch-blocks
